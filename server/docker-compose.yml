version: "2.4"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: material
      POSTGRES_USER: material
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U material -d material"]
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
      - "5432"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://material:${POSTGRES_PASSWORD}@db:5432/material
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
