<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>만능자재관리 스토어 스크린샷</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    color: #171d1e;
    background:
      radial-gradient(circle at 92% 8%, rgba(255,255,255,.18), transparent 28%),
      radial-gradient(circle at 6% 92%, rgba(255,255,255,.10), transparent 26%),
      linear-gradient(180deg, #3b79c7 0%, #1f5eae 42%, #123a76 100%);
  }
  .headline { padding: 72px 48px 0; text-align: center; }
  h1 { margin: 0; color: #fff; font-size: 64px; line-height: 1.22; font-weight: 800; letter-spacing: -1px; }
  .sub { margin: 18px 0 0; color: #d7e7f8; font-size: 32px; font-weight: 600; }
  .phone {
    width: 700px; height: 1360px; margin: 48px auto 0;
    background: #111; border-radius: 46px; padding: 14px;
    box-shadow: 0 24px 50px rgba(0,0,0,.28);
  }
  .screen {
    height: 100%; background: #f5fafb; border-radius: 34px; overflow: hidden;
    display: flex; flex-direction: column; position: relative;
  }
  .status {
    height: 36px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; font-size: 15px; font-weight: 700; color: #171d1e;
  }
  .status .right { display: flex; gap: 8px; align-items: center; color: #3f484a; font-size: 13px; }
  .appbar { height: 64px; display: flex; align-items: center; padding: 0 20px; font-size: 24px; font-weight: 700; }
  .body { flex: 1; padding: 4px 16px 8px; overflow: hidden; }
  .muted { color: #3f484a; font-size: 15px; }
  .month { display: flex; align-items: center; justify-content: space-between; margin: 12px 0; font-size: 22px; font-weight: 700; }
  .round {
    width: 40px; height: 40px; border-radius: 20px; border: none;
    background: #e7f2f4; color: #0f5f6e; font-size: 22px;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi {
    background: #fff; border: 1px solid #d5e0e2; border-radius: 16px; padding: 12px 14px;
  }
  .kpi b { display: block; font-size: 22px; margin-top: 4px; }
  .kpi span { color: #3f484a; font-size: 13px; }
  .kpi em { font-style: normal; color: #0f5f6e; font-size: 13px; font-weight: 700; }
  h2.sec { font-size: 18px; margin: 16px 0 8px; }
  .btn {
    display: block; width: 100%; text-align: center; background: #0f5f6e; color: #fff;
    border-radius: 14px; padding: 12px 0; font-size: 16px; font-weight: 700; margin-bottom: 8px;
  }
  .btn.ghost { background: #fff; color: #0f5f6e; border: 1px solid #b7c9cc; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .nav {
    height: 72px; background: #fff; border-top: 1px solid #e1e8ea;
    display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; text-align: center;
  }
  .nav div { font-size: 12px; color: #6f797b; font-weight: 700; }
  .nav div.on { color: #0f5f6e; }
  .nav svg { display: block; margin: 0 auto 2px; }
  .search {
    display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #b7c9cc;
    border-radius: 14px; padding: 10px 12px; margin: 8px 0;
  }
  .search input { border: none; outline: none; flex: 1; font-size: 16px; font-family: inherit; background: transparent; }
  .chips { display: flex; gap: 8px; margin-bottom: 10px; }
  .chip { border-radius: 10px; padding: 6px 12px; background: #e7f2f4; color: #0f5f6e; font-size: 14px; font-weight: 700; }
  .chip.off { background: #fff; border: 1px solid #c5d0d2; color: #3f484a; }
  .card {
    background: #fff; border: 1px solid #d5e0e2; border-radius: 16px; padding: 12px 14px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .card strong { display: block; font-size: 16px; }
  .card p { margin: 3px 0 0; color: #3f484a; font-size: 13px; }
  .tag { border-radius: 999px; padding: 4px 8px; font-size: 12px; font-weight: 800; white-space: nowrap; }
  .bad { background: #ffdad6; color: #93000a; }
  .ok { background: #d3f4d6; color: #0d5c1a; }
  .field { background: #fff; border: 1px solid #b7c9cc; border-radius: 12px; padding: 8px 12px; margin: 8px 0; }
  .field small { color: #3f484a; font-size: 12px; }
  .field b { display: block; font-size: 18px; }
  .kpi { min-height: 96px; }
  .kpi b { font-size: 28px; }
  .btn { padding: 16px 0; font-size: 18px; margin-bottom: 10px; }
  .card { padding: 14px 16px; margin-bottom: 10px; }
  .card strong { font-size: 18px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 14px; }
  .cal i { font-style: normal; color: #6f797b; }
  .cal b { display: flex; align-items: center; justify-content: center; min-height: 40px; border-radius: 8px; background: #fff; border: 1px solid #e1e8ea; font-weight: 700; }
  .cal b.empty { background: transparent; border-color: transparent; }
  .cal b.has { background: #b4ebf4; border-color: #b4ebf4; }
  .cal b.sel { background: #0f5f6e; color: #fff; border-color: #0f5f6e; }
  .note { font-size: 13px; color: #3f484a; margin: 6px 0 8px; }
  .cam { background: #111; color: #fff; flex: 1; position: relative; }
  .aim {
    position: absolute; left: 8%; right: 8%; top: 34%; height: 150px;
    border: 3px solid #fff; box-shadow: 0 0 0 2000px rgba(0,0,0,.45);
  }
  .cross { position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; transform: translate(-50%, -50%); }
  .cross:before, .cross:after { content: ""; position: absolute; background: #e53935; }
  .cross:before { left: 0; right: 0; top: 16px; height: 3px; }
  .cross:after { top: 0; bottom: 0; left: 16px; width: 3px; }
  .hit { position: absolute; left: 28%; top: 28%; width: 44%; height: 44%; border: 3px solid #4caf50; }
  .sheet { background: #fff; color: #171d1e; padding: 14px 16px 18px; border-radius: 18px 18px 0 0; }
  .modes { display: flex; gap: 8px; justify-content: center; }
  .mode { border-radius: 10px; padding: 6px 14px; border: 1px solid #c5d0d2; font-size: 14px; font-weight: 700; }
  .mode.on { background: #e7f2f4; border-color: #0f5f6e; color: #0f5f6e; }
  .menu { background: #fff; border: 1px solid #d5e0e2; border-radius: 16px; padding: 14px; margin-bottom: 8px; }
  .menu b { display: block; font-size: 16px; }
  .menu span { color: #3f484a; font-size: 13px; }
  .screen[data-mode="dark"] { background: #111; }
  .screen[data-mode="dark"] .status, .screen[data-mode="dark"] .appbar { color: #fff; }
</style>
</head>
<body>
  <div class="headline">
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="phone"><div class="screen" id="screen"></div></div>
<script>
const nav = (on) => {
  const items = [
    ["홈", '<path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/>'],
    ["자재", '<path d="M4 8h16v12H4z"/><path d="M8 8V5h8v3"/>'],
    ["생산", '<path d="M3 20V10l6-5 6 5v10"/><path d="M9 20v-6h6v6"/>'],
    ["실적", '<path d="M5 19V11M10 19V7M15 19v-6M20 19V9"/>'],
    ["더보기", '<circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/>']
  ];
  return `<div class="nav">${items.map((it, i) =>
    `<div class="${i===on?"on":""}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">${it[1]}</svg>${it[0]}</div>`
  ).join("")}</div>`;
};
const status = (dark) => `<div class="status"><span>9:41</span><span class="right">${dark?"●●●":"LTE"}  100%</span></div>`;
const calendar = (selected, hasDays, count) => {
  const labels = ["일","월","화","수","목","금","토"];
  const cells = ["","","",""];
  for (let d = 1; d <= count; d++) cells.push(String(d));
  while (cells.length % 7) cells.push("");
  return `<div class="cal">${labels.map(d => `<i>${d}</i>`).join("")}${cells.map(d => {
    if (!d) return `<b class="empty"></b>`;
    const cls = d === String(selected) ? "sel" : (hasDays.includes(Number(d)) ? "has" : "");
    return `<b class="${cls}">${d}</b>`;
  }).join("")}</div>`;
};
const shots = {
  1: {
    title: "이달 실적을 한눈에",
    sub: "투입비율 · 판매금액 · 재고경보",
    html: `${status()}<div class="appbar">만능자재관리</div><div class="body">
      <div class="muted">경주공장 · 김담당 · 관리책임자 · 서버 연결</div>
      <div class="month"><button class="round">‹</button>2026년 10월<button class="round">›</button></div>
      <div class="grid">
        <div class="kpi"><span>자재투입비율</span><b>62%</b><em>보통</em></div>
        <div class="kpi"><span>판매금액(단품)</span><b>1,284,000</b><span>원</span></div>
        <div class="kpi"><span>완성품 실적</span><b>4,500,000</b><span>30대/개</span></div>
        <div class="kpi"><span>단품생산</span><b>150</b><span>대/개</span></div>
        <div class="kpi"><span>재고경보</span><b>2건</b><span>안전재고 이하</span></div>
        <div class="kpi"><span>단품경보</span><b>1건</b><span>단품 안전재고 이하</span></div>
      </div>
      <h2 class="sec">오늘 할 일</h2>
      <div class="btn">자재 입고</div>
      <div class="btn">단품 생산실적</div>
      <div class="btn">완성품 실적</div>
      <h2 class="sec">자재 안전재고 경보</h2>
      <div class="card"><div><strong>NO.1  볼트 M8</strong><p>현재고 120 EA · 안전 400 · 리드타임 7일</p></div><span class="tag bad">부족</span></div>
      <div class="card"><div><strong>NO.4  브라켓 강판</strong><p>현재고 36 EA · 안전 80 · 리드타임 14일</p></div><span class="tag bad">부족</span></div>
    </div>${nav(0)}`
  },
  2: {
    title: "자재 입고와 현재고",
    sub: "번호 · 품명 · 안전재고를 바로 확인",
    html: `${status()}<div class="appbar">자재</div><div class="body">
      <div class="search"><span>⌕</span><input value="볼트" readonly /><span>▣</span></div>
      <div class="chips"><span class="chip">전체 48</span><span class="chip off">경보</span></div>
      <div class="card"><div><strong>NO.1  볼트 M8</strong><p>현재고 120 EA · 단가 80원 · 필요 400</p></div><span class="tag bad">부족</span></div>
      <div class="card"><div><strong>NO.2  너트 M8</strong><p>현재고 2,400 EA · 단가 40원 · 필요 400</p></div><span class="tag ok">정상</span></div>
      <div class="card"><div><strong>NO.3  와셔 M8</strong><p>현재고 860 EA · 단가 15원 · 필요 200</p></div><span class="tag ok">정상</span></div>
      <div class="card"><div><strong>NO.4  브라켓 강판</strong><p>현재고 36 EA · 단가 1,200원 · 필요 80</p></div><span class="tag bad">부족</span></div>
      <div class="card"><div><strong>NO.5  클립</strong><p>현재고 1,120 EA · 단가 25원 · 필요 300</p></div><span class="tag ok">정상</span></div>
    </div>${nav(1)}`
  },
  3: {
    title: "날짜만 눌러 생산실적",
    sub: "넣으면 자재 투입이 자동으로 계산됩니다",
    html: `${status()}<div class="appbar">단품 생산실적</div><div class="body">
      <div class="muted">오전에 전일·당일 실적을 넣으면 자재가 빠집니다.</div>
      <div class="month"><button class="round">‹</button>2026년 10월<button class="round">›</button></div>
      <div class="search"><span>⌕</span><input placeholder="단품명 / 번호 / 바코드" readonly /><span>▣</span></div>
      <div class="card"><div><strong>NO.5  브라켓 LH</strong><p>실적 80 / 계획 200</p></div><span class="tag ok">선택</span></div>
      <div class="field"><small>이달 생산계획</small><b>200</b></div>
      <div class="btn ghost">계획 저장</div>
      <div class="note">완제품 월계획 참고 150 (NO.1). 단품 계획과는 따로입니다.</div>
      ${calendar(2, [1,3,6,8,9,13], 17)}
    </div>${nav(2)}`
  },
  4: {
    title: "자동과 수동으로 바코드",
    sub: "코드집은 십자에 맞춰 터치해서 읽기",
    dark: true,
    html: `${status(true)}<div class="appbar">바코드 스캔</div>
      <div class="cam"><div class="aim"><div class="hit"></div><div class="cross"></div></div></div>
      <div class="sheet">
        <div class="modes"><span class="mode">자동</span><span class="mode on">수동 (터치해서 읽기)</span></div>
        <p style="text-align:center;font-weight:700">읽을 바코드: 85810-BOLT</p>
        <div class="btn">읽기</div>
      </div>`
  },
  5: {
    title: "그날 만든 단품과 완성품",
    sub: "날짜를 고르면 그 실적만 나옵니다",
    html: `${status()}<div class="appbar">매출 대비 자재실적</div><div class="body">
      <div class="month"><button class="round">‹</button>2026년 10월<button class="round">›</button></div>
      <div class="kpi" style="margin-bottom:10px"><span>종합</span><p class="note" style="margin:6px 0 0">판매금액 1,284,000원 · 단품 생산합계 150</p></div>
      <h2 class="sec">일자별 실적</h2>
      ${calendar(2, [1,3,6,8,9,13], 14)}
      <h2 class="sec">10월 2일 · 단품 2 · 완성품 1</h2>
      <div class="muted">단품</div>
      <div class="card"><div><strong>NO.5  브라켓 LH</strong><p>수량 40 · 바코드 85810-LH</p></div></div>
      <div class="card"><div><strong>NO.6  브라켓 RH</strong><p>수량 40 · 바코드 85810-RH</p></div></div>
      <div class="muted">완성품</div>
      <div class="card"><div><strong>NO.1  세트 A</strong><p>수량 12</p></div></div>
    </div>${nav(3)}`
  },
  6: {
    title: "공장 암호로 같이 씁니다",
    sub: "기초정보 수정은 관리자 암호",
    html: `${status()}<div class="appbar">더보기</div><div class="body">
      <div class="menu"><b>완제품 · 월계획</b><span>구성, 월계획, 완성품 일일 실적</span></div>
      <div class="menu"><b>입출고 이력</b><span>입고 · 반출 · 폐기 · 재고조정</span></div>
      <div class="menu"><b>재고조사</b><span>차이 수량은 관리책임자 승인 후 반영</span></div>
      <div class="menu"><b>월 마감</b><span>마감하면 실적을 고치지 않습니다</span></div>
      <div class="menu"><b>설정</b><span>권한 · 공장 암호 · 백업</span></div>
      <h2 class="sec">권한</h2>
      <div class="card"><div><strong>관리책임자</strong><p>공장 암호로 입장합니다. 자재·단품 수정은 관리자 암호입니다.</p></div></div>
      <div class="note">버전 1.1.34 · 서버 동기화 · Material 3</div>
    </div>${nav(4)}`
  }
};
const n = new URLSearchParams(location.search).get("n") || "1";
const shot = shots[n];
document.getElementById("title").textContent = shot.title;
document.getElementById("sub").textContent = shot.sub;
const screen = document.getElementById("screen");
if (shot.dark) screen.dataset.mode = "dark";
screen.innerHTML = shot.html;
</script>
</body>
</html>
